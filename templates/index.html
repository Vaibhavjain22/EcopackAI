<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EcoPackAI – Sustainable Packaging Recommendation</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--custom css-->

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">EcoPackAI – Packaging Material Recommendation</h2>

    <!-- Product Input Form -->
    <div class="card p-4 mb-4">
        <h5>Enter Product Details</h5>

        <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input type="text" id="product_name" class="form-control" placeholder="e.g. electronics">
        </div>

        <div class="mb-3">
            <label class="form-label">Product Weight (kg)</label>
            <input type="number" id="weight_kg" class="form-control" step="0.1">
        </div>

        <button class="btn btn-success" onclick="submitProduct()">Get Recommendation</button>
    </div>

    <!-- Recommendation Table -->
    <div class="card p-4">
        <h5>Recommended Materials</h5>

        <table class="table table-bordered mt-3">
            <thead class="table-dark">
                <tr>
                    <th>Material Type</th>
                    <th>CO₂ Impact</th>
                    <th>Cost Efficiency</th>
                    <th>Suitability Score</th>
                </tr>
            </thead>
            <tbody id="resultTable">
                <!-- Results will appear here -->
            </tbody>
        </table>
    </div>
</div>

<script>
function submitProduct() {
    const productName = document.getElementById("product_name").value;
    const weightKg = parseFloat(document.getElementById("weight_kg").value);

    if (!productName || isNaN(weightKg)) {
        alert("Please enter a valid product name and numeric weight.");
        return;
    }

    fetch("/api/product", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            product_name: productName,
            weight_kg: weightKg
        })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Failed to save product");
        }
        return response.json();
    })
    .then(data => {
        const productId = data.product_id || 1;
        fetchRecommendations(productId);
    })
    .catch(error => {
        alert("Error: " + error.message);
    });
}

function fetchRecommendations(productId = 1) {
    fetch("/api/recommend", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ product_id: parseInt(productId) })
    })
    .then(response => response.json())
    .then(data => {
        const table = document.getElementById("resultTable");
        table.innerHTML = "";

        if (!data.recommendations || data.recommendations.length === 0) {
            table.innerHTML = "<tr><td colspan='4' class='text-center'>No suitable recommendations found for this weight.</td></tr>";
            return;
        }

        data.recommendations.forEach(item => {
            table.innerHTML += `
                <tr>
                    <td><strong>${item.Material_Type}</strong></td>
                    <td>${item.Co2_impact_index_pred.toFixed(3)}</td>
                    <td>${item.cost_efficiency_pred.toFixed(3)}</td>
                    <td><span class="badge bg-success">${item.suitability_score.toFixed(3)}</span></td>
                </tr>
            `;
        });
    })
    .catch(error => {
        console.error("Error fetching recommendations:", error);
    });
}
</script>

</body>
</html>
